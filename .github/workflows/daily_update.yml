name: daily-signal-update

# Runs automatically every weekday at 12:00 UTC (5:30pm IST, after NSE close),
# and can also be triggered manually from the Actions tab for testing.
on:
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

# Needed so this workflow's temporary GITHUB_TOKEN is allowed to push a
# commit back to the repo (updating dashboard/data/latest_signals.json).
# No other secrets or API keys are required -- yfinance needs no auth.
permissions:
  contents: write

jobs:
  update-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate today's signals
        run: python src/generate_daily_signals.py

      - name: Commit and push if the signals actually changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/latest_signals.json
          git diff --quiet --cached || git commit -m "daily signal update"
          git push
